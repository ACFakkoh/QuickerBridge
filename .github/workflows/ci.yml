name: Checks and build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black --check quickerbridge tests build_portable.py launch.py
      - run: python -m pytest tests vendor/pycba/tests/test_nonprismatic.py -q
      # Same suite in the browser configuration: no matplotlib, NumPy-only SciPy subset.
      - run: python -m pytest tests -q
        env:
          QB_MPL_STUB: "1"
          QB_SCIPY_LITE: "1"
      - run: python build_portable.py --no-release
      - run: node --check dist/app.js
      - run: node --check dist/modes.js
      - run: node --check dist/axle.js
      - run: node --check dist/sections.js

